<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Халтурка</title>
    <script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
  </head>
  <body>
    <div class="phone">
      <div class="hud">
        <div><span data-t="score">ОЧКИ</span><b id="score">0</b></div>
        <div><span data-t="best">РЕКОРД</span><b id="best">0</b></div>
        <div><span data-t="rows">РЯДЫ</span><b id="lines">0</b></div>
        <div><span data-t="lives">ЖИЗНИ</span><b id="lives"></b></div>
        <button type="button" class="sound" id="btn-pause"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" rx="1.5" fill="currentColor" /><rect x="11" y="2" width="4" height="14" rx="1.5" fill="currentColor" /></svg></button>
        <button type="button" class="sound" id="btn-sound" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 H6 L10 4 V16 L6 12.5 H3 Z" fill="currentColor" /><path class="on" d="M13 7.5 Q14.6 10 13 12.5 M15.6 5.5 Q18.6 10 15.6 14.5" /><path class="off" d="M13.5 7.5 L18 12.5 M18 7.5 L13.5 12.5" /></svg></button>
      </div>

      <div class="screen-area">
        <div class="screen">
          <canvas id="lcd"></canvas>
          <div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
        </div>
      </div>

      <div class="pad" id="pad">
        <button type="button" id="btn-left"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M18 6 L9 14 L18 22" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
        <button type="button" id="btn-jump"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M6 18 L14 9 L22 18" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
        <button type="button" id="btn-right"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M10 6 L19 14 L10 22" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
